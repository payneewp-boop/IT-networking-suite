name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Primary target.
          - os: windows-latest
            python-version: "3.12"
          # Other platforms the code supports.
          - os: macos-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.12"
          # Minimum supported Python (pyproject requires >=3.8).
          - os: ubuntu-latest
            python-version: "3.8"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install -e .

      - name: Run tests
        run: python -m unittest discover -v
